<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RNGdom</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #0f0e14;
        --panel: #242228;
        --panel-hover: #29272e;
        --border: #45424b;
        --text: #f1f1f4;
        --muted: #9b98a5;

        --pink: #ff1493;
        --purple: #8b5cf6;
        --blue: #2684ff;
        --green: #00d99b;
        --orange: #ff9d00;

        /* rarity palette */
        --trash: #7a7782;
        --common: #c9c6d1;
        --uncommon: #00d6a0;
        --rare: #448eff;
        --legendary: #ffb020;
        --mythical: #ef4fe0;
    }

    html {
        background: var(--bg);
    }

    body {
        min-height: 100vh;

        background: var(--bg);
        color: var(--text);

        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        overflow-x: hidden;
    }

    button {
        font: inherit;
    }

    a {
        color: inherit;
    }

    /* =========================================
       NAVBAR
    ========================================= */

    .navbar {
        position: fixed;

        top: 0;
        left: 0;
        right: 0;

        height: 40px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 14px;

        z-index: 100;

        font-size: 12px;
        font-weight: 700;
    }

    .nav-left,
    .nav-right {
        display: flex;
        align-items: center;
    }

    .nav-left {
        gap: 11px;
    }

    .nav-icon {
        width: 20px;
        height: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #9998a0;

        font-size: 15px;
    }

    .logo {
        font-size: 19px;
        font-weight: 900;

        letter-spacing: 1px;
    }

    /* =========================================
       THEME
    ========================================= */

    .theme-switcher {
        display: flex;

        height: 30px;

        border: 1px solid #48464e;
        border-radius: 4px;

        overflow: hidden;
    }

    .theme-btn {
        width: 28px;

        border: 0;
        border-right: 1px solid #48464e;

        background: transparent;

        color: #aaa;

        cursor: pointer;

        font-size: 14px;
    }

    .theme-btn:last-child {
        border-right: 0;
    }

    .theme-btn.active {
        background: #e9e9e9;
        color: #202027;
    }

    /* =========================================
       HOME
    ========================================= */

    #homeScreen {
        width: 100%;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        padding-top: 180px;
        padding-bottom: 90px;
    }

    .home-content {
        width: 440px;
        max-width: calc(100vw - 30px);

        text-align: center;
    }

    /* =========================================
       QUESTION MARKS
    ========================================= */

    .question-mark {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 6px;

        height: 86px;

        margin-bottom: 28px;

        color: #d5d4d8;

        font-size: 72px;
        font-weight: 900;

        line-height: 1;
    }

    .question {
        display: inline-block;

        transform: translateY(0);

        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }

    .question:nth-child(1) {
        animation: questionFloat 2.4s ease-in-out infinite;
    }

    .question:nth-child(2) {
        animation: questionFloat 2.4s ease-in-out 0.15s infinite;
    }

    .question:nth-child(3) {
        animation: questionFloat 2.4s ease-in-out 0.3s infinite;
    }

    .question:nth-child(4) {
        animation: questionFloat 2.4s ease-in-out 0.45s infinite;
    }

    .question:nth-child(5) {
        animation: questionFloat 2.4s ease-in-out 0.6s infinite;
    }

    .question:nth-child(6) {
        animation: questionFloat 2.4s ease-in-out 0.75s infinite;
    }

    @keyframes questionFloat {
        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-4px);
        }
    }

    .subtitle {
        color: #aaa7b3;

        font-size: 20px;
        font-weight: 400;

        margin-bottom: 38px;
    }

    /* =========================================
       GENERATE BUTTON
    ========================================= */

    .generate-btn {
        width: 360px;
        height: 84px;

        max-width: 100%;

        position: relative;

        border: 2px solid transparent;
        border-radius: 8px;

        background:
            linear-gradient(#09090c, #09090c) padding-box,
            linear-gradient(
                100deg,
                #ff1795,
                #b929ff,
                #724cff
            ) border-box;

        color: white;

        font-size: 35px;
        font-weight: 900;

        letter-spacing: 2px;

        cursor: pointer;

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            opacity 0.2s ease;
    }

    .generate-btn::before {
        content: "";

        position: absolute;

        inset: -4px;

        border-radius: 12px;

        background:
            linear-gradient(
                90deg,
                rgba(255, 20, 147, 0.35),
                rgba(130, 50, 255, 0.35)
            );

        filter: blur(16px);

        z-index: -1;

        opacity: 0.8;
    }

    .generate-btn:hover:not(:disabled) {
        transform: translateY(-2px);

        box-shadow:
            0 0 22px rgba(255, 20, 147, 0.28),
            0 0 30px rgba(120, 60, 255, 0.22);
    }

    .generate-btn:active:not(:disabled) {
        transform: translateY(1px) scale(0.99);
    }

    .generate-btn:disabled {
        cursor: wait;
        opacity: 0.75;
    }

    /* =========================================
       RESULT SCREEN
    ========================================= */

    #resultScreen {
        width: 100%;
        min-height: 100vh;

        display: none;

        justify-content: center;
        align-items: flex-start;

        padding-top: 70px;
        padding-bottom: 100px;
    }

    .result-content {
        width: 560px;
        max-width: calc(100vw - 30px);

        margin: 0 auto;

        text-align: center;
    }

    /* =========================================
       ROLLING NUMBER
    ========================================= */

    .result-number {
        width: 175px;
        height: 76px;

        margin: 0 auto 14px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 2px solid #59565f;
        border-radius: 10px;

        background: #201f24;

        color: #9b98a5;

        font-family: monospace;
        font-size: 34px;
        font-weight: 900;

        box-shadow:
            0 0 20px rgba(140, 138, 150, 0.14);

        transition:
            border-color 0.35s ease,
            color 0.35s ease,
            box-shadow 0.35s ease,
            transform 0.15s ease;
    }

    .result-number.rolling {
        border-color: #6a6772;

        color: #9b98a5;

        box-shadow:
            0 0 15px rgba(150, 148, 160, 0.5),
            0 0 35px rgba(150, 148, 160, 0.22);

        transform: scale(1.035);
    }

    /*
        Once the rarity is revealed, the box
        recolors to match it via these classes
        (added/removed in JS alongside rarityBox).
    */

    .result-number.result-trash {
        border-color: var(--trash);
        color: var(--trash);
        box-shadow: 0 0 20px rgba(122, 119, 130, 0.25);
    }

    .result-number.result-common {
        border-color: var(--common);
        color: var(--common);
        box-shadow: 0 0 20px rgba(201, 198, 209, 0.22);
    }

    .result-number.result-uncommon {
        border-color: var(--uncommon);
        color: var(--uncommon);
        box-shadow: 0 0 20px rgba(0, 214, 160, 0.25);
    }

    .result-number.result-rare {
        border-color: var(--rare);
        color: var(--rare);
        box-shadow: 0 0 20px rgba(68, 142, 255, 0.25);
    }

    .result-number.result-legendary {
        border-color: var(--legendary);
        color: var(--legendary);
        box-shadow: 0 0 22px rgba(255, 176, 32, 0.3);
    }

    .result-number.result-mythical {
        border-color: var(--mythical);
        color: var(--mythical);
        box-shadow: 0 0 26px rgba(239, 79, 224, 0.45);
    }

    .result-digits {
        display: flex;
        justify-content: center;
        align-items: center;

        gap: 0;
    }

    .result-digit {
        display: inline-block;

        width: 20px;

        text-align: center;
    }

    .result-digit.locked {
        animation: digitLock 0.25s ease-out;
    }

    @keyframes digitLock {
        0% {
            transform: translateY(-7px);
            opacity: 0.2;
        }

        60% {
            transform: translateY(2px);
            opacity: 1;
        }

        100% {
            transform: translateY(0);
            opacity: 1;
        }
    }

    /* =========================================
       RESULT INFORMATION
    ========================================= */

    .rarity {
        display: inline-flex;

        align-items: center;

        gap: 10px;

        margin-bottom: 12px;

        font-size: 13px;
        font-weight: 900;

        /*
            Hidden until badges finish
            revealing. JS adds
            .rarity-show once the
            badge animation completes.
        */
        opacity: 0;

        transform: translateY(10px) scale(0.96);

        transition:
            opacity 0.5s ease,
            transform 0.5s cubic-bezier(.2,.8,.2,1);
    }

    .rarity.rarity-show {
        opacity: 1;

        transform: translateY(0) scale(1);
    }

    .rarity-label {
        padding: 4px 11px;

        border: 1px solid var(--rare);
        border-radius: 3px;

        color: var(--rare);
    }

    .rarity.rarity-trash .rarity-label       { border-color: var(--trash);     color: var(--trash); }
    .rarity.rarity-common .rarity-label      { border-color: var(--common);    color: var(--common); }
    .rarity.rarity-uncommon .rarity-label    { border-color: var(--uncommon);  color: var(--uncommon); }
    .rarity.rarity-rare .rarity-label        { border-color: var(--rare);      color: var(--rare); }
    .rarity.rarity-legendary .rarity-label   { border-color: var(--legendary); color: var(--legendary); }
    .rarity.rarity-mythical .rarity-label    { border-color: var(--mythical);  color: var(--mythical); box-shadow: 0 0 14px rgba(239, 79, 224, 0.5); }

    .top-percent {
        color: #00d97e;
    }

    .rarity.rarity-trash .top-percent      { color: var(--trash); }
    .rarity.rarity-common .top-percent     { color: var(--common); }
    .rarity.rarity-uncommon .top-percent   { color: var(--uncommon); }
    .rarity.rarity-rare .top-percent       { color: var(--rare); }
    .rarity.rarity-legendary .top-percent  { color: var(--legendary); }
    .rarity.rarity-mythical .top-percent   { color: var(--mythical); }

    .result-xp {
        display: inline-block;

        margin-bottom: 10px;

        padding: 5px 16px;

        border: 1px solid #1557bd;
        border-radius: 14px;

        color: #4b91ff;

        font-family: monospace;
        font-size: 14px;
        font-weight: 800;
    }

    .total-xp {
        color: #d8d6dc;

        font-family: monospace;
        font-size: 16px;
    }

    .lifetime {
        color: #8d8a95;

        font-size: 12px;

        margin-bottom: 6px;
    }

    /* =========================================
       ACTIONS
    ========================================= */

    .result-actions {
        margin-top: 16px;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 14px;
    }

    .reroll-btn {
        padding: 8px 18px;

        border: 1px solid #7a2f76;
        border-radius: 6px;

        background: #26242a;

        color: #e48ae0;

        font-size: 13px;
        font-weight: 800;

        cursor: pointer;

        transition:
            background 0.15s ease,
            transform 0.15s ease;
    }

    .reroll-btn:hover {
        background: #302e35;

        transform: translateY(-1px);
    }

    .reroll-btn:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    /* =========================================
       BADGES
    ========================================= */

    .breakdown-title {
        margin-top: 20px;

        color: white;

        font-size: 18px;
        font-weight: 900;
    }

    .badge-count {
        margin-top: 3px;

        color: #8f8c97;

        font-size: 11px;
    }

    .badges {
        width: 100%;

        margin-top: 14px;

        display: flex;
        flex-direction: column;

        gap: 10px;

        text-align: left;
    }

    .badge {
        position: relative;

        padding: 12px 16px 14px;

        border: 1px solid #4c4952;
        border-radius: 7px;

        background: #232127;

        /*
            Start invisible.
            JavaScript adds .badge-show one by one.
        */
        opacity: 0;

        transform:
            translateY(18px)
            scale(0.97);

        transition:
            opacity 0.6s ease,
            transform 0.6s cubic-bezier(.2,.8,.2,1);

        overflow: hidden;
    }

    .badge::after {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 50%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.045),
                transparent
            );

        transform: skewX(-20deg);
    }

    .badge.badge-show {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

    .badge.badge-show::after {
        animation: badgeShine 0.7s ease-out;
    }

    @keyframes badgeShine {
        from {
            left: -100%;
        }

        to {
            left: 160%;
        }
    }

    .badge:hover {
        background: #29272e;

        transform:
            translateY(-1px)
            scale(1.005);
    }

    .badge.trash        { border-color: #45424b; }
    .badge.common        { border-color: #5c5964; }
    .badge.uncommon      { border-color: #205b52; }
    .badge.rare          { border-color: #38536d; }
    .badge.legendary     { border-color: #7a5417; box-shadow: 0 0 16px rgba(255, 176, 32, 0.08); }
    .badge.mythical      { border-color: #7c2a76; box-shadow: 0 0 20px rgba(239, 79, 224, 0.16); }

    .badge-header {
        display: flex;

        align-items: center;

        gap: 8px;
    }

    .badge-icon {
        font-size: 16px;
    }

    .badge-name {
        color: #eee;

        font-size: 12px;
        font-weight: 900;
    }

    .badge-rarity {
        padding: 2px 8px;

        border-radius: 4px;

        font-size: 10px;
        font-weight: 900;
    }

    .badge-rarity.trash {
        color: var(--trash);

        border: 1px solid #56535c;
    }

    .badge-rarity.common {
        color: var(--common);

        border: 1px solid #66636c;
    }

    .badge-rarity.uncommon {
        color: var(--uncommon);

        background: rgba(0, 220, 160, 0.08);

        border: 1px solid #007d61;
    }

    .badge-rarity.rare {
        color: var(--rare);

        background: rgba(30, 100, 255, 0.08);

        border: 1px solid #225ab1;
    }

    .badge-rarity.legendary {
        color: var(--legendary);

        background: rgba(255, 176, 32, 0.1);

        border: 1px solid #a06c00;
    }

    .badge-rarity.mythical {
        color: var(--mythical);

        background: rgba(239, 79, 224, 0.12);

        border: 1px solid #a72d9c;
    }

    .badge-xp {
        position: absolute;

        right: 10px;
        top: 10px;

        padding: 2px 9px;

        border: 1px solid #824d00;
        border-radius: 9px;

        color: #ffa900;

        font-family: monospace;

        font-size: 11px;
        font-weight: 900;
    }

    .badge-description {
        margin-top: 6px;

        color: #8f8b96;

        font-size: 11px;

        line-height: 1.35;
    }

    .digits {
        display: flex;

        gap: 4px;

        margin-top: 9px;
    }

    .digit {
        width: 18px;
        height: 20px;

        display: flex;

        align-items: center;
        justify-content: center;

        border: 1px solid #55525a;
        border-radius: 3px;

        background: #34323a;

        color: #aaa7b0;

        font-family: monospace;

        font-size: 9px;
        font-weight: 900;
    }

    .digit.highlight {
        background: #73d8ff;

        border-color: #278ad0;

        color: #07121b;
    }

    /* =========================================
       LIGHT MODE
    ========================================= */

    body.light {
        --bg: #f4f4f6;
        --panel: #ffffff;
        --panel-hover: #f6f6f8;
        --border: #cccbd1;
        --text: #202025;
        --muted: #66646c;
    }

    body.light .navbar,
    body.light .logo {
        color: #222;
    }

    body.light .subtitle {
        color: #65636b;
    }

    body.light .generate-btn {
        background:
            linear-gradient(#fff, #fff) padding-box,
            linear-gradient(
                100deg,
                #ff1795,
                #8b35ff
            ) border-box;

        color: #15151a;
    }

    body.light .question-mark {
        color: #333;
    }

    body.light .badge {
        background: #f8f8fa;

        color: #222;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

        .navbar {
            padding: 0 10px;
        }

        #homeScreen {
            padding-top: 130px;
        }

        .question-mark {
            gap: 4px;

            font-size: 56px;
        }

        .subtitle {
            font-size: 16px;
        }

        .generate-btn {
            width: 300px;
            height: 68px;

            font-size: 27px;
        }

        #resultScreen {
            padding-top: 60px;
        }

        .result-actions {
            flex-wrap: wrap;
        }
    }
</style>
</head>

<body>

<!-- =========================================
     NAVBAR
========================================= -->

<header class="navbar">

    <div class="nav-left">

        <div class="logo">
            RNGdom
        </div>

        <div class="nav-icon">
            ?
        </div>

        <div class="nav-icon">
            🎮
        </div>

    </div>


    <div class="nav-right">

        <div class="theme-switcher">

            <button
                class="theme-btn"
                id="sunBtn"
                title="Light"
            >
                ☀
            </button>

            <button
                class="theme-btn active"
                id="systemBtn"
                title="System"
            >
                ◐
            </button>

            <button
                class="theme-btn"
                id="moonBtn"
                title="Dark"
            >
                ☾
            </button>

        </div>

    </div>

</header>


<!-- =========================================
     HOME SCREEN
========================================= -->

<main id="homeScreen">

    <div class="home-content">

        <div class="question-mark">

            <span class="question">?</span>
            <span class="question">?</span>
            <span class="question">?</span>
            <span class="question">?</span>
            <span class="question">?</span>
            <span class="question">?</span>

        </div>


        <p class="subtitle">
            Roll as many times as you want. See how lucky you get.
        </p>


        <button
            class="generate-btn"
            id="generateButton"
        >
            GENERATE
        </button>

    </div>

</main>


<!-- =========================================
     RESULT SCREEN
========================================= -->

<section id="resultScreen">

    <div class="result-content">

        <!-- NUMBER -->

        <div
            class="result-number"
            id="resultNumber"
        >
            <div
                class="result-digits"
                id="resultDigits"
            >
                <span class="result-digit">0</span>
                <span class="result-digit">0</span>
                <span class="result-digit">0</span>
                <span class="result-digit">0</span>
                <span class="result-digit">0</span>
                <span class="result-digit">0</span>
            </div>
        </div>


        <!-- RARITY -->

        <div class="rarity" id="rarityBox">

            <span class="rarity-label" id="rarityLabel">
                COMMON
            </span>

            <span>
                •
            </span>

            <span class="top-percent" id="topPercent">
                TOP 50%
            </span>

        </div>


        <!-- XP -->

        <div>
            <span
                class="result-xp"
                id="rollXP"
            >
                0 EP
            </span>
        </div>


        <div class="total-xp" id="totalXP">
            0 EP
        </div>


        <div class="lifetime">
            YOUR LIFETIME EP
        </div>


        <!-- ACTIONS -->

        <div class="result-actions">

            <button
                class="reroll-btn"
                id="rerollButton"
            >
                ↻ REROLL
            </button>

        </div>


        <!-- BADGES -->

        <h2 class="breakdown-title">
            BADGE BREAKDOWN
        </h2>


        <div class="badge-count" id="badgeCount">
            0 BADGES EARNED
        </div>


        <div class="badges" id="badges"></div>

    </div>

</section>


<script>
/* =====================================================
   ELEMENTS
===================================================== */

const homeScreen =
    document.getElementById("homeScreen");

const resultScreen =
    document.getElementById("resultScreen");

const generateButton =
    document.getElementById("generateButton");

const rerollButton =
    document.getElementById("rerollButton");

const resultNumber =
    document.getElementById("resultNumber");

const resultDigits =
    document.getElementById("resultDigits");

const rollXP =
    document.getElementById("rollXP");

const totalXPEl =
    document.getElementById("totalXP");

const badgesContainer =
    document.getElementById("badges");

const badgeCountEl =
    document.getElementById("badgeCount");

const rarityBox =
    document.getElementById("rarityBox");

const rarityLabelEl =
    document.getElementById("rarityLabel");

const topPercentEl =
    document.getElementById("topPercent");


/* =====================================================
   RARITY SYSTEM
===================================================== */

const RARITY_ORDER =
    ["trash", "common", "uncommon", "rare", "legendary", "mythical"];

const RARITY_XP = {
    trash: 30,
    common: 140,
    uncommon: 360,
    rare: 900,
    legendary: 2400,
    mythical: 7000
};

const RARITY_TOP_RANGE = {
    trash:      [80, 99],
    common:     [50, 80],
    uncommon:   [22, 50],
    rare:       [7, 22],
    legendary:  [1, 7],
    mythical:   [0.1, 1]
};

/*
    Overall rarity is based on how much total EP
    the roll earned — not your single best badge,
    and not a separate badge-weight score. Just:
    the more you racked up together, the rarer the
    overall result.

    Pushed much harder now — 6,000 EP lands you at
    "uncommon", not much higher. Reaching rare+ means
    stacking multiple rare/legendary-tier badges in a
    single roll, and mythical (outside the 1-2 digit
    glitch override) should be a genuine jackpot.
*/

const RARITY_EP_THRESHOLDS = {
    trash: 0,
    common: 1500,
    uncommon: 6000,
    rare: 20000,
    legendary: 60000,
    mythical: 150000
};

function rarityFromXP(totalXP) {

    let tier = "trash";

    RARITY_ORDER.forEach(r => {

        if (totalXP >= RARITY_EP_THRESHOLDS[r]) {
            tier = r;
        }

    });

    return tier;

}

/* =====================================================
   NUMBER HELPERS
===================================================== */

function isPrime(n) {

    if (n < 2) return false;

    for (let i = 2; i * i <= n; i++) {

        if (n % i === 0) return false;

    }

    return true;

}

function isPerfectSquare(n) {

    const r = Math.round(Math.sqrt(n));

    return r * r === n;

}

function isPerfectCube(n) {

    const r = Math.round(Math.cbrt(n));

    return r * r * r === n;

}

function isTriangular(n) {

    const k = Math.round((-1 + Math.sqrt(1 + 8 * n)) / 2);

    return k * (k + 1) / 2 === n;

}

const FIB_SET =
    new Set([121393, 196418, 317811, 514229, 832040]);

function digitCounts(digits) {

    const counts = {};

    digits.forEach(d => {

        counts[d] = (counts[d] || 0) + 1;

    });

    return counts;

}

function uniqueCount(digits) {

    return new Set(digits).size;

}


/* =====================================================
   NUMBER GENERATION

   Normally always a 6-digit roll. VERY VERY RARELY
   (about a 1.5% chance) the roll "glitches" and comes
   out shorter — and within that already-rare pool,
   shorter lengths are weighted to be rarer still, so
   landing on 1-2 digits is extremely unlikely overall.
===================================================== */

const GLITCH_CHANCE = 0.015;

const GLITCH_LENGTH_WEIGHTS = [
    { length: 5, weight: 45 },
    { length: 4, weight: 28 },
    { length: 3, weight: 16 },
    { length: 2, weight: 8 },
    { length: 1, weight: 3 }
];

function pickGlitchLength() {

    const totalWeight =
        GLITCH_LENGTH_WEIGHTS.reduce((sum, w) => sum + w.weight, 0);

    let roll = Math.random() * totalWeight;

    for (const entry of GLITCH_LENGTH_WEIGHTS) {

        if (roll < entry.weight) return entry.length;

        roll -= entry.weight;

    }

    return GLITCH_LENGTH_WEIGHTS[0].length;

}

function rollNumber() {

    if (Math.random() < GLITCH_CHANCE) {

        const length = pickGlitchLength();

        const min = length === 1 ? 0 : Math.pow(10, length - 1);
        const max = Math.pow(10, length) - 1;

        return Math.floor(min + Math.random() * (max - min + 1));

    }

    return Math.floor(100000 + Math.random() * 900000);

}

/* =====================================================
   XP
===================================================== */

function calculateResult(number) {

    const str = String(number);

    const digits =
        str.split("").map(Number);


    const matched =
        badges.filter(b => {

            try {
                return b.test(digits, str, number);
            } catch (e) {
                return false;
            }

        });


    /*
        If nothing beyond the trivial
        "contains/opens/closes" badges
        was earned, hand out the
        consolation "NOTHING SPECIAL" badge.
    */

    const meaningful =
        matched.filter(b =>
            !b.id.startsWith("contains-") &&
            !b.id.startsWith("starts-") &&
            !b.id.startsWith("ends-")
        );

    if (meaningful.length === 0) {

        matched.push(
            badges.find(b => b.id === "boring")
        );

    }


    /*
        VERY VERY RARE glitch: the roll can come up
        short a handful of digits instead of six.
        The fewer digits, the rarer the badge tier —
        and 1-2 digits is an automatic Mythical
        overall result, no matter what else matched.
    */

    if (digits.length < 6) {

        let glitchRarity;

        if (digits.length <= 2) {
            glitchRarity = "mythical";
        } else if (digits.length <= 4) {
            glitchRarity = "legendary";
        } else {
            glitchRarity = "rare";
        }

        matched.push({
            id: "glitched-roll",
            name: "GLITCH IN THE MATRIX",
            icon: "🌀",
            rarity: glitchRarity,
            xp: RARITY_XP[glitchRarity],
            description:
                `THE ROLL GLITCHED, PRODUCING ONLY ${digits.length} DIGIT${digits.length === 1 ? "" : "S"} INSTEAD OF SIX.`,
            highlight: () => digits.map(() => true)
        });

    }


    /*
        Rarer badges land last, right before
        the overall rarity reveal.
    */

    matched.sort((a, b) =>
        RARITY_ORDER.indexOf(a.rarity) -
        RARITY_ORDER.indexOf(b.rarity)
    );


    const totalXP =
        matched.reduce((sum, b) => sum + b.xp, 0);


    /*
        Overall rarity comes from the total EP the
        roll earned (see rarityFromXP) — except a
        1-2 digit glitch roll always overrides
        straight to Mythical.
    */

    const overallRarity =
        digits.length <= 2
            ? "mythical"
            : rarityFromXP(totalXP);


    return { digits, str, matched, totalXP, overallRarity };

}


/* =====================================================
   CREATE DIGITS
===================================================== */

function createRollingDigits(count = 6) {

    resultDigits.innerHTML = "";

    for (let i = 0; i < count; i++) {

        const digit =
            document.createElement("span");

        digit.className =
            "result-digit";

        digit.textContent = "0";

        resultDigits.appendChild(digit);

    }

}


/* =====================================================
   ROLL ANIMATION
===================================================== */

function rollAnimation(number) {

    return new Promise((resolve) => {

        const target =
            String(number);

        createRollingDigits(target.length);

        const digits =
            [...document.querySelectorAll(
                ".result-digit"
            )];

        resultNumber.classList.add("rolling");


        /*
            Each digit spins independently.

            Digit 1 stops first.
            Then digit 2.
            Then digit 3...
        */

        digits.forEach((digit, index) => {

            let interval;

            const spinTime =
                750 +
                index * (330 + 1000); // each digit now reveals 1s later than the one before it


            interval =
                setInterval(() => {

                    digit.textContent =
                        Math.floor(
                            Math.random() * 10
                        );

                }, 55);


            setTimeout(() => {

                clearInterval(interval);

                digit.textContent =
                    target[index];

                digit.classList.add(
                    "locked"
                );


                /*
                    Remove the class so
                    rerolls can animate again.
                */

                setTimeout(() => {

                    digit.classList.remove(
                        "locked"
                    );

                }, 300);


                /*
                    Last digit finished.
                */

                if (index === digits.length - 1) {

                    setTimeout(() => {

                        resultNumber.classList.remove(
                            "rolling"
                        );

                        resolve();

                    }, 250);

                }

            }, spinTime);

        });

    });

}


/* =====================================================
   BADGE RENDERING
===================================================== */

function renderBadgeElement(badge, digits) {

    const el =
        document.createElement("div");

    el.className =
        `badge ${badge.rarity}`;


    const highlights =
        badge.highlight
            ? badge.highlight(digits)
            : digits.map(() => false);


    const digitsHTML =
        digits.map((d, i) =>
            `<span class="digit${highlights[i] ? " highlight" : ""}">${d}</span>`
        ).join("");


    el.innerHTML = `
        <div class="badge-header">
            <span class="badge-icon">${badge.icon}</span>
            <span class="badge-name">${badge.name}</span>
            <span class="badge-rarity ${badge.rarity}">${badge.rarity.toUpperCase()}</span>
        </div>
        <span class="badge-xp">+${badge.xp.toLocaleString()} EP</span>
        <div class="badge-description">${badge.description}</div>
        <div class="digits">${digitsHTML}</div>
    `;

    return el;

}


/* =====================================================
   BADGE ANIMATION

   Badges reveal slowly, one at a time, and this
   returns a Promise that resolves once the very
   last badge has finished animating in — so the
   rarity reveal can wait for it.
===================================================== */

const BADGE_START_DELAY = 300;
const BADGE_STEP_DELAY = 180;
const BADGE_TRANSITION_MS = 600;

function animateBadges(result) {

    return new Promise((resolve) => {

        badgesContainer.innerHTML = "";

        const elements =
            result.matched.map(badge =>
                renderBadgeElement(badge, result.digits)
            );

        elements.forEach(el =>
            badgesContainer.appendChild(el)
        );

        badgeCountEl.textContent =
            `${result.matched.length} BADGES EARNED`;


        elements.forEach((el, index) => {

            setTimeout(() => {

                el.classList.add("badge-show");

            }, BADGE_START_DELAY + index * BADGE_STEP_DELAY);

        });


        const totalTime =
            BADGE_START_DELAY +
            Math.max(0, elements.length - 1) * BADGE_STEP_DELAY +
            BADGE_TRANSITION_MS;

        setTimeout(() => {

            resolve();

        }, totalTime);

    });

}


/* =====================================================
   RARITY REVEAL
===================================================== */

function hideRarity() {

    rarityBox.classList.remove("rarity-show");

    RARITY_ORDER.forEach(r => {
        rarityBox.classList.remove(`rarity-${r}`);
        resultNumber.classList.remove(`result-${r}`);
    });

}

function showRarity(rarity) {

    RARITY_ORDER.forEach(r => {
        rarityBox.classList.remove(`rarity-${r}`);
        resultNumber.classList.remove(`result-${r}`);
    });

    rarityBox.classList.add(`rarity-${rarity}`);
    resultNumber.classList.add(`result-${rarity}`);


    rarityLabelEl.textContent =
        rarity.toUpperCase();


    const [lo, hi] =
        RARITY_TOP_RANGE[rarity];

    const pct =
        (Math.random() * (hi - lo) + lo);

    topPercentEl.textContent =
        `TOP ${pct < 1 ? pct.toFixed(1) : Math.round(pct)}%`;


    rarityBox.classList.add("rarity-show");

}


/* =====================================================
   SHOW RESULT
===================================================== */

async function showResult() {

    const number =
        rollNumber();

    const result =
        calculateResult(number);


    generateButton.disabled = true;
    rerollButton.disabled = true;


    homeScreen.style.display = "none";
    resultScreen.style.display = "flex";

    hideRarity();

    badgesContainer.innerHTML = "";
    badgeCountEl.textContent = "0 BADGES EARNED";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    await rollAnimation(number);


    rollXP.textContent =
        result.totalXP.toLocaleString() + " EP";


    await animateBadges(result);

    showRarity(result.overallRarity);


    lifetimeEP += result.totalXP;

    totalXPEl.textContent =
        lifetimeEP.toLocaleString() + " EP";


    generateButton.disabled = false;
    rerollButton.disabled = false;

}

===================================================== */

    "click",

            return;

        rerollButton.disabled = true;
        rerollButton.textContent = "ROLLING...";


        hideRarity();


        const number =
            rollNumber();

            calculateResult(number);


        await rollAnimation(number);


        rollXP.textContent =
            result.totalXP.toLocaleString() + " EP";

            lifetimeEP.toLocaleString() + " EP";

        rerollButton.textContent = "↻ REROLL";

    }

}

    }
);

);
